"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Citations tab header
description: Citations tab header for citations and links block
status: stable
props:
  type: object
  properties:
    tab_id:
      type: ["string", "null"]
      title: Tab id
      description: Tab ID for the citations tab content
    tab_title:

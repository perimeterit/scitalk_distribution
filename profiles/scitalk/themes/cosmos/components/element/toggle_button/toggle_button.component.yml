'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Toggle button
status: stable
description: Button that controls another element; just creates a button with the aria-controls mark-up
props:
  type: object
  properties:
    name:
      type: string
      title: Name
      description: What this toggles (e.g. menu, search), used for classes
    hide_text:
      type: string
      title: 'Hide text'
      description: string to use for the hide state text; will default to "Hide {name}"
    controls:
      type: string
      title: Controls
      description: Id of the element this controls
    display_label:
      type: boolean
      title: 'Label display'
      description: Whether to show the button label (show text)
    icon_name:
      type: string
      title: Icon
    button_style:
      type: ['string','null']
      title: Button style
      description: Button style class (e.g. default, secondary, unstyled). Unstyled is default
